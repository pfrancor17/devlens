[project]
name = "devlens-ml"
version = "0.1.0"
description = "Training pipelines for the DevLens models"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Patricia Franco Ruiz" }]
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "pyyaml>=6.0",
    "scikit-learn>=1.5",
    "xgboost>=2.1",
    "onnx>=1.16",
    "onnxmltools>=1.12",
    "onnxruntime>=1.18",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
devlens-train = "devlens_ml.train:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/devlens_ml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "N"]
